model: gpt-o1
label:
  en_US: gpt-o1 (via AskSage)
model_type: llm
features:
- agent-thought
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: temperature
  use_template: temperature
- name: max_tokens
  use_template: max_tokens
  required: false
  default: 4096
  min: 1
  max: 16384
- name: live
  label:
    en_US: Web Search
  type: int
  help:
    en_US: "Live web search mode. 0 = off, 1 = Google results, 2 = Google + web page summaries (Live+). Not CUI/Sensitive-data compliant."
  required: false
  default: 0
  min: 0
  max: 2
