model: google-gemini-2.5-flash
label:
  en_US: google-gemini-2.5-flash (via AskSage)
model_type: llm
features:
- agent-thought
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
- name: temperature
  use_template: temperature
- name: max_tokens
  use_template: max_tokens
  required: false
  default: 4096
  min: 1
  max: 16384
