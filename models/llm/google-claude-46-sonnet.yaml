model: google-claude-46-sonnet
label:
  en_US: Claude 4.6 Sonnet (via AskSage)
model_type: llm
features:
  - agent-thought
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    required: false
    default: 8192
    min: 1
    max: 16384
pricing:
  input: "3.00"
  output: "15.00"
  unit: "0.000001"
  currency: USD
