model: gpt-4.1-mini
label:
  en_US: gpt-4.1-mini (via AskSage)
model_type: llm
features:
- agent-thought
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: temperature
  use_template: temperature
- name: max_tokens
  use_template: max_tokens
  required: false
  default: 4096
  min: 1
  max: 16384
