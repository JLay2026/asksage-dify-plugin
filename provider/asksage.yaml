provider: asksage
label:
  en_US: AskSage
description:
  en_US: >-
    AskSage provides secure access to multiple AI models (GPT-4o, Claude, Mistral, etc.)
    through a unified API, with FedRAMP-authorized infrastructure.
icon_small:
  en_US: icon_s_en.svg
icon_large:
  en_US: icon_l_en.svg
background: "#1A1A2E"

help:
  title:
    en_US: Get your API Key from AskSage
  url:
    en_US: https://docs.asksage.ai/docs/api-documentation/api-documentation.html

supported_model_types:
  - llm

configurate_methods:
  - predefined-model
  - customizable-model

# --- Provider-level credentials (shared across all models) ---
provider_credential_schema:
  credential_form_schemas:
    - variable: asksage_api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your AskSage API key
    - variable: asksage_email
      label:
        en_US: Email
      type: text-input
      required: true
      placeholder:
        en_US: Enter the email associated with your AskSage account
    - variable: asksage_api_base
      label:
        en_US: API Base URL
      type: text-input
      required: false
      default: "https://api.asksage.ai"
      placeholder:
        en_US: "https://api.asksage.ai"

# --- Per-model credentials (for customizable-model) ---
model_credential_schema:
  model:
    label:
      en_US: Model Name
    placeholder:
      en_US: Enter the AskSage model identifier (e.g., gpt-4o)
  credential_form_schemas:
    - variable: asksage_api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your AskSage API key
    - variable: asksage_email
      label:
        en_US: Email
      type: text-input
      required: true
      placeholder:
        en_US: Enter the email associated with your AskSage account
    - variable: asksage_api_base
      label:
        en_US: API Base URL
      type: text-input
      required: false
      default: "https://api.asksage.ai"
      placeholder:
        en_US: "https://api.asksage.ai"

models:
  llm:
    predefined:
      - "models/llm/*.yaml"
    position: "models/llm/_position.yaml"

extra:
  python:
    provider_source: provider/asksage.py
    model_sources:
      - "models/llm/llm.py"